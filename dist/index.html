<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paper Room</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpath fill='%233b6354' d='M4 4h32v32H4z'/%3E%3Cpath fill='%23fff5df' d='M9 29L29 9v20z'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head><body>
<header><a class="brand" href="#"><span class="brand-icon">◩</span><b data-t="brand">Paper Room</b><small>PAPER ROOM</small></a><nav><button id="explore" class="active" data-t="explore"></button><button id="learn" data-t="learn"></button></nav><div class="header-actions"><select id="language" aria-label="Language"><option value="0">简中</option><option value="1">繁中</option><option value="2">EN</option></select><button id="theme" class="icon-button" aria-label="Dark mode">☾</button><button id="library" class="quiet"><span>▦</span> <span data-t="library"></span></button><button id="save" class="primary"><span>↓</span> <span data-t="save"></span></button></div></header>
<div class="projectbar"><div><span class="status-dot"></span><button id="titleButton"><span id="title"></span> <span class="pencil">✎</span></button><span id="saveStatus"></span></div><div class="history"><button id="undo" data-title="undo">↶</button><button id="redo" data-title="redo">↷</button><span class="separator"></span><button id="newProject">＋ <span data-t="newProject"></span></button></div></div>
<main><aside><div class="eyebrow" data-t="material"></div><h1 data-t="start"></h1><p class="intro" data-t="intro"></p><label><span data-t="paper"></span><select id="paper"><option value="a4" data-t="a4"></option><option value="a3" data-t="a3"></option><option value="square" data-t="square"></option><option value="rect" data-t="rect"></option><option value="strip" data-t="strip"></option></select></label><button id="addPaper" class="outline">＋ <span data-t="addPaper"></span></button><div class="divider"></div><label class="colorrow"><span data-t="front"></span><input type="color" id="front" value="#fff9ed"></label><label class="colorrow"><span data-t="back"></span><input type="color" id="back" value="#dac4ae"></label><label class="colorrow"><span data-t="background"></span><input type="color" id="bg" value="#e8ece7"></label><div class="divider"></div><section id="brushPanel" hidden><label><span data-t="brush"></span><output id="brushValue">16 mm</output><input type="range" id="brush" min="2" max="50" value="16"></label><button id="clearGlue" class="outline" data-t="clearGlue"></button></section><section class="guide"><div class="eyebrow" id="guideTitle"></div><p id="guideText"></p><div class="key-help"><kbd>Space</kbd><span data-t="confirm"></span><kbd>Esc</kbd><span data-t="cancel"></span></div></section><div class="snap-note"><span>⌖</span><div><b data-t="snap"></b><p data-t="snapHint"></p></div></div><details><summary data-t="limits"></summary><p data-t="limitsText"></p></details><footer><span>MADE OF POSSIBILITIES</span><small>PAPER ROOM / STUDIO 02</small></footer></aside>
<section id="stage"><canvas id="canvas" aria-label="Interactive paper workspace"></canvas><div class="stage-status"><span id="pieceLabel"></span><span id="sideLabel"></span></div><div class="view-tools"><button id="top" data-t="top"></button><button id="view" data-t="view"></button><button id="fit" data-title="fit">⛶</button></div><div class="tools"><button data-tool="fold" class="selected"><i>⌁</i><span data-t="fold"></span></button><button data-tool="cut"><i>✂</i><span data-t="cut"></span></button><button data-tool="move"><i>✥</i><span data-t="move"></span></button><button data-tool="glue"><i>♧</i><span data-t="glue"></span></button><button data-tool="compass"><i>⏣</i><span data-t="compass"></span></button><hr><button id="flip"><i>⇄</i><span data-t="flip"></span></button><button id="unfold"><i>▱</i><span data-t="unfold"></span></button></div><div id="pending" hidden><div><span class="pending-dot"></span><span id="pendingLabel"></span></div><button id="confirm" class="primary"><span data-t="confirm"></span><kbd>Space</kbd></button><button id="cancel" data-t="cancel"></button></div><div id="toast" role="status" aria-live="polite"></div><button id="bin" class="bin"><span class="bin-icon">♲</span><span data-t="bin"></span><small id="binCount">0</small></button><div class="stage-footer"><span data-t="controls"></span><span id="zoomLabel">100%</span></div></section></main>
<dialog id="gallery" class="large-dialog"><div class="dialog-heading"><div><div class="eyebrow">YOUR COLLECTION</div><h2 data-t="library"></h2></div><button data-close="gallery" class="close" data-title="close">×</button></div><p class="muted" data-t="localNote"></p><div class="gallery-layout"><div class="folder-panel"><div id="folders"></div><button id="newFolder" class="outline">＋ <span data-t="newFolder"></span></button><button id="import" class="quiet" data-t="import"></button></div><div><div class="collection-actions"><button id="folderRename" data-t="rename" hidden></button><button id="folderDelete" class="danger" data-t="delete" hidden></button><button id="undoLibrary" data-t="deleteUndo" hidden></button></div><div id="projects" class="cards"></div></div></div></dialog>
<dialog id="trashDialog" class="large-dialog"><div class="dialog-heading"><div><div class="eyebrow">A SECOND CHANCE</div><h2 data-t="bin"></h2></div><button data-close="trashDialog" class="close">×</button></div><p class="muted" data-t="binNote"></p><div class="collection-actions"><button id="restoreAll" class="outline" data-t="restoreAll"></button><button id="deleteAll" class="danger" data-t="deleteAll"></button></div><div id="trashCards" class="cards"></div></dialog>
<dialog id="nameDialog" class="small-dialog"><form id="nameForm"><div class="dialog-heading"><h2 id="nameHeading"></h2><button type="button" data-close="nameDialog" class="close">×</button></div><label><span id="nameLabel"></span><input id="nameInput" maxlength="80" required autocomplete="off"></label><label id="folderField"><span data-t="folder"></span><select id="saveFolder"></select></label><p id="formError" class="danger"></p><div class="dialog-buttons"><button type="button" data-close="nameDialog" data-t="cancel"></button><button type="submit" class="primary" data-t="save"></button></div></form></dialog>
<input type="file" id="fileInput" accept=".json,application/json" hidden><script src="engine.js"></script><script src="i18n.js"></script><script src="app.js"></script></body></html>
